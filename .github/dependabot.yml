# Keeps the actions in .github/workflows up to date. The editor, Glance and
# Node images are not Dependabot's job: they move together, so the Update
# workflow (scripts/update-glance.sh) handles them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: CI
