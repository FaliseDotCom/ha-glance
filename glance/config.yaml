name: Glance
version: "1.2.0.1"
slug: glance
description: Self-hosted dashboard for your feeds and services, with a no-code editor.
url: https://github.com/FaliseDotCom/ha-glance/tree/main/glance
homeassistant: 2026.7.0
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
map:
  - app_config:rw
  - media:ro
  - share:ro
ports:
  8080/tcp: 8080
  3000/tcp: 8090
webui: http://[HOST]:[PORT:3000]
options: {}
schema: {}
